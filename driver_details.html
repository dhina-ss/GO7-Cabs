<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>GO7 Cabs - Driver Details</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#004ac6">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="go7-logo.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#00174b",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#c3c6d7",
                        "on-secondary-fixed": "#0b1c30",
                        "primary-container": "#2563eb",
                        "on-surface": "#191c1e",
                        "on-surface-variant": "#434655",
                        "tertiary-fixed": "#dae2fd",
                        "inverse-primary": "#b4c5ff",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-primary": "#ffffff",
                        "secondary-fixed": "#d3e4fe",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#dbe1ff",
                        "on-secondary-fixed-variant": "#38485d",
                        "tertiary": "#4d556b",
                        "surface-tint": "#0053db",
                        "on-primary-fixed-variant": "#003ea8",
                        "surface-container-highest": "#e0e3e5",
                        "tertiary-container": "#656d84",
                        "primary": "#004ac6",
                        "surface-container-low": "#f2f4f6",
                        "secondary-container": "#d0e1fb",
                        "surface-bright": "#f7f9fb",
                        "on-secondary-container": "#54647a",
                        "surface-container": "#eceef0",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-container": "#eeefff",
                        "outline": "#737686",
                        "tertiary-fixed-dim": "#bec6e0",
                        "inverse-on-surface": "#eff1f3",
                        "on-error": "#ffffff",
                        "secondary": "#505f76",
                        "secondary-fixed-dim": "#b7c8e1",
                        "error": "#ba1a1a",
                        "surface-container-high": "#e6e8ea",
                        "background": "#f7f9fb",
                        "on-tertiary-fixed": "#131b2e",
                        "surface-dim": "#d8dadc",
                        "surface": "#f7f9fb",
                        "on-background": "#191c1e",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#e0e3e5",
                        "on-tertiary-container": "#eef0ff",
                        "on-tertiary-fixed-variant": "#3f465c",
                        "inverse-surface": "#2d3133"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "currency-md": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-lg": ["Inter"]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-background text-on-background min-h-screen flex justify-center w-full">
    <div class="w-full max-w-md min-h-screen bg-surface flex flex-col relative overflow-hidden shadow-2xl">
        <!-- Top App Bar -->
        <header
            class="fixed top-0 left-0 w-full z-40 bg-surface/90 backdrop-blur-md border-b border-outline-variant flex justify-start items-center h-16 px-4 max-w-md left-1/2 -translate-x-1/2">
            <a href="driver.html"
                class="text-on-surface-variant flex items-center justify-center p-2 rounded-full hover:bg-surface-container transition-colors">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <img src="go7-logo.png" alt="Go 7 Logo" class="h-9 w-auto object-contain" />
        </header>

        <!-- Main Content Canvas -->
        <main class="pt-20 px-4 py-24 space-y-6 flex-1 overflow-y-auto">
            <!-- Profile Header Card -->
            <section
                class="bg-surface-container-lowest border border-outline-variant/60 rounded-2xl p-6 shadow-sm flex flex-col items-center text-center space-y-4 relative">
                <button id="open-edit-modal-btn" title="Edit Driver Details"
                    class="absolute top-4 right-4 text-primary bg-primary/10 hover:bg-primary/20 p-2 rounded-full transition-colors flex items-center justify-center">
                    <span class="material-symbols-outlined text-[18px]">edit</span>
                </button>

                <div class="w-20 h-20 rounded-full bg-primary/10 text-primary font-bold text-2xl flex items-center justify-center border-2 border-primary/20 shadow-sm"
                    id="driver-avatar-circle">
                    <span id="driver-avatar-initial">-</span>
                </div>

                <div>
                    <h2 id="driver-display-name" class="text-xl font-bold text-on-surface">Loading Driver...</h2>
                    <p id="driver-display-id-phone" class="text-xs text-on-surface-variant mt-1">ID: - • -</p>
                </div>

                <span id="driver-display-status"
                    class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800">
                    Active
                </span>

                <div class="flex gap-3 w-full pt-1">
                    <a id="driver-call-btn" href="#"
                        class="flex-1 flex items-center justify-center gap-1.5 bg-primary text-on-primary rounded-xl py-2.5 text-xs font-semibold hover:bg-primary/90 transition-all active:scale-95 shadow-sm">
                        <span class="material-symbols-outlined text-[16px]">call</span> Call Driver
                    </a>
                    <a id="driver-msg-btn" href="#"
                        class="flex-1 flex items-center justify-center gap-1.5 bg-surface-container-low text-on-surface rounded-xl py-2.5 text-xs font-semibold hover:bg-surface-container-high transition-all active:scale-95 border border-outline-variant/60">
                        <span class="material-symbols-outlined text-[16px]">chat</span> Message
                    </a>
                </div>
            </section>

            <!-- Performance Summary Bento Grid -->
            <section class="grid grid-cols-2 gap-3">
                <div
                    class="bg-surface-container-lowest border border-outline-variant/60 rounded-xl p-4 shadow-sm flex flex-col">
                    <span class="material-symbols-outlined text-primary text-[20px] mb-1">route</span>
                    <p class="text-xs text-on-surface-variant font-medium">Total Trips</p>
                    <p id="driver-total-trips" class="text-2xl font-bold text-on-surface mt-1">0</p>
                </div>

                <div
                    class="bg-surface-container-lowest border border-outline-variant/60 rounded-xl p-4 shadow-sm flex flex-col">
                    <span class="material-symbols-outlined text-emerald-600 text-[20px] mb-1">payments</span>
                    <p class="text-xs text-on-surface-variant font-medium">Total Earnings</p>
                    <p id="driver-total-earnings" class="text-xl font-bold text-emerald-700 mt-1">₹0</p>
                </div>
            </section>

            <!-- Recent Trip History -->
            <section
                class="bg-surface-container-lowest border border-outline-variant/60 rounded-2xl shadow-sm overflow-hidden space-y-0">
                <div class="p-4 border-b border-outline-variant/40 flex justify-between items-center bg-surface-bright">
                    <h3 class="text-xs font-bold text-on-surface">Recent Trip Activity</h3>
                    <button id="view-all-btn" class="text-xs text-primary font-semibold hover:underline">View All</button>
                </div>

                <div id="driver-trips-list" class="divide-y divide-outline-variant/30">
                    <div class="p-6 text-center text-xs text-on-surface-variant">No recent trips for this driver</div>
                </div>
            </section>
        </main>

        <!-- Floating Rounded Bottom Navigation Bar (Mobile) -->
        <nav
            class="fixed bottom-3 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-sm h-16 bg-surface/95 backdrop-blur-md border border-outline-variant/60 rounded-full shadow-lg flex justify-around items-center z-50 transition-all">
            <a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-all p-2 active:scale-95"
                href="home.html">
                <span class="material-symbols-outlined">home</span>
                <span class="text-[10px]">Home</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-all p-2 active:scale-95"
                href="trip.html">
                <span class="material-symbols-outlined">route</span>
                <span class="text-[10px]">Trip</span>
            </a>
            <a class="flex flex-col items-center gap-1 text-primary p-2 transition-transform active:scale-95"
                href="driver.html">
                <span class="material-symbols-outlined filled">person_pin</span>
                <span class="text-[10px] font-semibold">Driver</span>
            </a>
        </nav>
    </div>

    <!-- Edit Driver Details Modal -->
    <div id="edit-driver-modal"
        class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div
            class="bg-surface-container-lowest w-full max-w-md rounded-2xl border border-outline-variant shadow-2xl p-6 space-y-4 relative">
            <div class="flex justify-between items-center border-b border-outline-variant/40 pb-3">
                <h3 class="text-lg font-bold text-on-surface flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary">edit_square</span>
                    Edit Driver Profile
                </h3>
                <button type="button" id="close-edit-modal-btn"
                    class="w-8 h-8 flex items-center justify-center hover:text-on-surface p-1 rounded-full bg-slate-100 hover:bg-surface-container transition-colors">
                    <span class="material-symbols-outlined text-[20px]">close</span>
                </button>
            </div>

            <form id="edit-driver-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Driver ID</label>
                    <input type="text" id="edit-driver-id" readonly disabled
                        class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-3 py-2 text-sm text-on-surface-variant opacity-75 outline-none cursor-not-allowed" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Driver Name <span
                            class="text-error">*</span></label>
                    <input type="text" id="edit-driver-name" placeholder="Driver Name" required
                        class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-3 py-2 text-sm text-on-surface focus:ring-2 focus:ring-primary outline-none" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Mobile Number <span
                            class="text-error">*</span></label>
                    <input type="tel" id="edit-driver-phone" placeholder="Mobile Number" required
                        class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-3 py-2 text-sm text-on-surface focus:ring-2 focus:ring-primary outline-none" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">License Number <span
                            class="text-xs font-normal text-on-surface-variant/70">(Optional)</span></label>
                    <input type="text" id="edit-driver-license" placeholder="e.g. TN-1420110012345"
                        class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-3 py-2 text-sm text-on-surface focus:ring-2 focus:ring-primary outline-none" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Aadhaar Number <span
                            class="text-xs font-normal text-on-surface-variant/70">(Optional)</span></label>
                    <input type="text" id="edit-driver-aadhar" placeholder="e.g. 5482 9102 3341"
                        class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-3 py-2 text-sm text-on-surface focus:ring-2 focus:ring-primary outline-none" />
                </div>
                <div>
                    <label class="block text-xs font-semibold text-on-surface-variant mb-1">Address <span
                            class="text-xs font-normal text-on-surface-variant/70">(Optional)</span></label>
                    <textarea id="edit-driver-address" rows="2" placeholder="e.g. Flat 302, Green Park, MG Road, Pune"
                        class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-3 py-2 text-sm text-on-surface focus:ring-2 focus:ring-primary outline-none resize-none"></textarea>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="button" id="cancel-edit-modal-btn"
                        class="flex-1 py-2.5 rounded-xl border border-outline-variant text-on-surface font-semibold text-sm hover:bg-surface-container transition-colors">
                        Cancel
                    </button>
                    <button type="submit"
                        class="flex-1 py-2.5 rounded-xl bg-primary text-white font-semibold text-sm hover:bg-primary/90 shadow-md transition-colors">
                        Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const driverId = urlParams.get('id');
            const driverName = urlParams.get('name');
            const driverTrips = urlParams.get('trips');
            const driverEarnings = urlParams.get('earnings');

            if (driverName) {
                const nameEl = document.getElementById('driver-display-name');
                if (nameEl) nameEl.textContent = driverName;
                const initialEl = document.getElementById('driver-avatar-initial');
                if (initialEl) initialEl.textContent = driverName.charAt(0).toUpperCase();
                const editNameInput = document.getElementById('edit-driver-name');
                if (editNameInput) editNameInput.value = driverName;
            }

            const driverPhone = urlParams.get('phone') || '';

            function updateDriverPhoneLinks(phoneNum) {
                const callBtn = document.getElementById('driver-call-btn');
                const msgBtn = document.getElementById('driver-msg-btn');
                if (!phoneNum) {
                    if (callBtn) { callBtn.href = 'javascript:void(0)'; callBtn.classList.add('opacity-50', 'pointer-events-none'); }
                    if (msgBtn) { msgBtn.href = 'javascript:void(0)'; msgBtn.classList.add('opacity-50', 'pointer-events-none'); }
                } else {
                    const cleanPhone = phoneNum.replace(/\s+/g, '');
                    if (callBtn) { callBtn.href = `tel:${cleanPhone}`; callBtn.classList.remove('opacity-50', 'pointer-events-none'); }
                    if (msgBtn) { msgBtn.href = `sms:${cleanPhone}`; msgBtn.classList.remove('opacity-50', 'pointer-events-none'); }
                }
            }

            updateDriverPhoneLinks(driverPhone);

            if (driverId) {
                const idEl = document.getElementById('driver-display-id-phone');
                if (idEl) idEl.textContent = `ID: ${driverId}${driverPhone ? ' • ' + driverPhone : ''}`;
                const editIdInput = document.getElementById('edit-driver-id');
                if (editIdInput) editIdInput.value = driverId;
            }

            if (driverTrips) {
                const tripsEl = document.getElementById('driver-total-trips');
                if (tripsEl) tripsEl.textContent = driverTrips;
            }
            if (driverEarnings) {
                const earningsEl = document.getElementById('driver-total-earnings');
                if (earningsEl) earningsEl.textContent = '₹' + driverEarnings;
            }

            async function loadDriverDetailsFromDB(id) {
                if (!id) return;
                try {
                    const res = await fetch(`/api/drivers/${encodeURIComponent(id)}`);
                    const json = await res.json();
                    if (json.success && json.data) {
                        const d = json.data.driver;
                        const trips = json.data.trips || [];

                        const nameEl = document.getElementById('driver-display-name');
                        if (nameEl) nameEl.textContent = d.name;
                        const avatarInitial = document.getElementById('driver-avatar-initial');
                        if (avatarInitial) avatarInitial.textContent = d.name ? d.name.charAt(0).toUpperCase() : 'D';

                        const idEl = document.getElementById('driver-display-id-phone');
                        if (idEl) idEl.textContent = `ID: ${d.id}${d.phone ? ' • ' + d.phone : ''}`;
                        updateDriverPhoneLinks(d.phone || '');

                        const tripsEl = document.getElementById('driver-total-trips');
                        if (tripsEl) tripsEl.textContent = d.trips_count || trips.length;

                        const earningsEl = document.getElementById('driver-total-earnings');
                        if (earningsEl) earningsEl.textContent = '₹' + parseFloat(d.total_earnings || 0).toLocaleString('en-IN');

                        const editNameInput = document.getElementById('edit-driver-name');
                        if (editNameInput) editNameInput.value = d.name || '';
                        const editIdInput = document.getElementById('edit-driver-id');
                        if (editIdInput) editIdInput.value = d.id || '';
                        const editPhoneInput = document.getElementById('edit-driver-phone');
                        if (editPhoneInput) editPhoneInput.value = d.phone || '';

                        // Render dynamic trips list
                        const listContainer = document.getElementById('driver-trips-list');
                        if (listContainer) {
                            listContainer.innerHTML = '';
                            if (trips.length === 0) {
                                listContainer.innerHTML = `<div class="p-6 text-center text-xs text-on-surface-variant">No recent trips for this driver</div>`;
                            } else {
                                trips.forEach(t => {
                                    const dObj = new Date(t.trip_date);
                                    const dateStr = dObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                                    const inc = parseFloat(t.income || 0).toLocaleString('en-IN');
                                    const item = document.createElement('div');
                                    item.className = 'p-4 flex items-center justify-between hover:bg-surface-container-low transition-colors';
                                    item.innerHTML = `
                                        <div class="flex items-center gap-3">
                                            <div class="bg-primary/10 w-9 h-9 rounded-full flex items-center justify-center text-primary">
                                                <span class="material-symbols-outlined text-[18px]">route</span>
                                            </div>
                                            <div>
                                                <p class="text-xs font-bold text-on-surface">${t.from_location || 'Trip'} ${t.to_location ? '➔ ' + t.to_location : ''}</p>
                                                <p class="text-[11px] text-on-surface-variant">${dateStr} • Type: ${t.trip_type}</p>
                                            </div>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-xs font-bold text-on-surface">₹${inc}</p>
                                        </div>
                                    `;
                                    listContainer.appendChild(item);
                                });
                            }
                        }
                    }
                } catch (e) {
                    console.warn('Could not fetch driver details from DB:', e);
                }
            }

            if (driverId) loadDriverDetailsFromDB(driverId);

            // Edit Modal Controls
            const editModal = document.getElementById('edit-driver-modal');
            const openEditBtn = document.getElementById('open-edit-modal-btn');
            const closeEditBtn = document.getElementById('close-edit-modal-btn');
            const cancelEditBtn = document.getElementById('cancel-edit-modal-btn');
            const editForm = document.getElementById('edit-driver-form');

            if (openEditBtn && editModal) {
                openEditBtn.addEventListener('click', () => {
                    editModal.classList.remove('hidden');
                });

                const closeModal = () => {
                    editModal.classList.add('hidden');
                };

                if (closeEditBtn) closeEditBtn.addEventListener('click', closeModal);
                if (cancelEditBtn) cancelEditBtn.addEventListener('click', closeModal);

                editModal.addEventListener('click', (e) => {
                    if (e.target === editModal) closeModal();
                });

                if (editForm) {
                    editForm.addEventListener('submit', async (e) => {
                        e.preventDefault();
                        const newName = document.getElementById('edit-driver-name').value.trim();
                        const newPhone = document.getElementById('edit-driver-phone').value.trim();

                        try {
                            const res = await fetch(`/api/drivers/${encodeURIComponent(driverId)}`, {
                                method: 'PUT',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ name: newName, phone: newPhone })
                            });
                            const json = await res.json();
                            if (json.success) {
                                closeModal();
                                loadDriverDetailsFromDB(driverId);
                            } else {
                                alert(json.message || 'Error updating driver profile');
                            }
                        } catch (err) {
                            console.error('Error updating driver:', err);
                        }
                    });
                }
            }
        });
    </script>
</body>

</html>
