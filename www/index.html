<body class="bg-background text-on-background font-body-md min-h-screen pb-20">
    <!-- Top App Bar (Mobile) -->
    <header
        class="fixed top-0 left-0 w-full z-40 bg-surface/80 backdrop-blur-md dark:bg-background/80 border-b border-outline-variant dark:border-outline flex justify-between items-center h-16 px-4">

    </header>
    <!-- Main Content Canvas -->
    <main class="pt-20 px-4 space-y-stack-lg max-w-md mx-auto pb-6">
        <!-- Modern Premium Month Filter Section -->
        <section class="space-y-2">
            <div class="flex items-center gap-2">
                <!-- Main Month Picker Trigger Card -->
                <button id="month-picker-trigger" type="button"

                        <div class="w-6 h-6 rounded-lg bg-gradient-to-tr from-primary to-primary-container text-white flex items-center justify-center flex-shrink-0 shadow-sm shadow-primary/25">

                        </div>
                        <div class="text-left min-w-0">
                            <span id="active-month-display" class="text-sm font-extrabold text-on-surface truncate block mt-0.5">Sep - 2026</span>
                        </div>
                    </div>
                    <div class="flex items-center text-on-surface-variant group-hover:text-primary transition-colors pr-1">
                        <span class="material-symbols-outlined text-[20px] transition-transform group-hover:translate-y-0.5">expand_more</span>
                    </div>
                </button>
            </div>

            <!-- Scrollable Quick-Chips Row -->
            <div id="quick-month-chips" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5 px-0.5">
                <!-- Dynamically injected chips -->
            </div>
        </section>

        <!-- Bento Analysis Summary Cards -->
        <section class="grid grid-cols-2 gap-3">
            <div
                class="bg-surface-container-lowest border border-outline-variant/60 rounded-2xl p-4 shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-center text-on-surface-variant mb-1">
                    <span class="text-xs font-semibold">Total Trips</span>
                    <span class="material-symbols-outlined text-primary text-[20px]">local_taxi</span>
                </div>
                <span id="stat-total-trips" class="text-2xl font-bold text-on-surface mt-1">0</span>
            </div>

            <div
                class="bg-surface-container-lowest border border-outline-variant/60 rounded-2xl p-4 shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-center text-on-surface-variant mb-1">
                    <span class="text-xs font-semibold">Net Profit</span>
                    <span class="material-symbols-outlined text-primary text-[20px]">savings</span>
                </div>
                <span id="stat-net-profit" class="text-xl font-bold text-primary mt-1">₹0</span>
            </div>

            <div
                class="bg-surface-container-lowest border border-outline-variant/60 rounded-2xl p-4 shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-center text-on-surface-variant mb-1">
                    <span class="text-xs font-semibold">Total Income</span>
                    <span class="material-symbols-outlined text-emerald-600 text-[20px]">account_balance_wallet</span>
                </div>
                <span id="stat-total-income" class="text-xl font-bold text-emerald-700 mt-1">₹0</span>
            </div>

            <div
                class="bg-surface-container-lowest border border-outline-variant/60 rounded-2xl p-4 shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-center text-on-surface-variant mb-1">
                    <span class="text-xs font-semibold">Expenses</span>
                    <span class="material-symbols-outlined text-error text-[20px]">credit_card</span>
                </div>
                <span id="stat-total-expense" class="text-xl font-bold text-error mt-1">₹0</span>

        </section>
        <!-- Charts Section -->
        <div class="space-y-6">
            <!-- Monthly Trip Count (Last 6 Months) -->

    <!-- Modern Month Picker Sheet Modal -->
    <div id="month-picker-modal" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/50 backdrop-blur-sm hidden transition-opacity">
        <div class="bg-surface-container-lowest border border-outline-variant/60 rounded-t-3xl sm:rounded-3xl w-full max-w-sm shadow-2xl p-5 space-y-4 max-h-[90vh] overflow-y-auto">
            <!-- Modal Header -->
            <div class="flex items-center justify-between pb-2 border-b border-outline-variant/30">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-xl bg-primary/10 text-primary flex items-center justify-center">
                        <span class="material-symbols-outlined text-[18px]">calendar_month</span>
                    </div>
                    <h3 class="text-sm font-bold text-on-surface">Filter By Month</h3>
                </div>
                <button type="button" id="close-month-modal-btn" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-container text-on-surface-variant transition-colors cursor-pointer">

            <!-- All Months Option -->
            <button type="button" id="modal-all-months-btn"

                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-xl bg-primary/10 text-primary flex items-center justify-center flex-shrink-0">
                        <span class="material-symbols-outlined text-[18px]">all_inclusive</span>
                    </div>
                    <div>
                        <p class="font-bold text-xs text-on-surface">All Months</p>
                        <p class="text-[10px] text-on-surface-variant font-normal">View lifetime aggregate metrics</p>
                    </div>
                </div>
                <span id="all-months-check" class="material-symbols-outlined text-primary text-[20px] hidden">check_circle</span>
            </button>

            <!-- Year Selector in Modal -->
            <div class="flex items-center justify-between bg-surface-container-low p-1.5 rounded-2xl">
                <button type="button" id="modal-prev-year-btn" class="w-8 h-8 flex items-center justify-center rounded-xl bg-surface-container-lowest hover:bg-surface-container text-on-surface transition-all active:scale-95 shadow-xs cursor-pointer">
                    <span class="material-symbols-outlined text-[16px]">chevron_left</span>
                </button>
                <span id="modal-year-display" class="font-extrabold text-xs text-on-surface tracking-wide">2026</span>
                <button type="button" id="modal-next-year-btn" class="w-8 h-8 flex items-center justify-center rounded-xl bg-surface-container-lowest hover:bg-surface-container text-on-surface transition-all active:scale-95 shadow-xs cursor-pointer">
                    <span class="material-symbols-outlined text-[16px]">chevron_right</span>
                </button>
            </div>

            <!-- 12-Month Grid (Jan - Dec) -->
            <div id="modal-months-grid" class="grid grid-cols-3 gap-2">
                <!-- Dynamically populated month cards -->
            </div>
        </div>
    </div>

    <script>
        let barChartInstance = null;
        let lineChartInstance = null;
        let donutChartInstance = null;

        function getCurrentYearMonth() {
            const now = new Date();
            const yr = now.getFullYear();
            const mo = String(now.getMonth() + 1).padStart(2, '0');
            return `${yr}-${mo}`;
        }

        // Default to current month
        let selectedMonth = getCurrentYearMonth();
        let modalYear = parseInt(selectedMonth.split('-')[0], 10) || new Date().getFullYear();
        let availableMonthsCache = [];

        const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        // Format as 'Jan - 2026'
        function formatMonthDisplayName(ym) {
            if (!ym || ym === 'all') return 'All Months';
            const parts = ym.split('-');
            if (parts.length !== 2) return ym;
            const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, 1);
            if (isNaN(d.getTime())) return ym;
            const shortMonth = d.toLocaleDateString('en-US', { month: 'short' });
            const fullYear = d.getFullYear();
            return `${shortMonth} - ${fullYear}`;
        }

        function getAdjacentMonth(ym, offset) {
            if (!ym || ym === 'all') ym = getCurrentYearMonth();
            const [yStr, mStr] = ym.split('-');
            const d = new Date(parseInt(yStr, 10), parseInt(mStr, 10) - 1 + offset, 1);
            const yr = d.getFullYear();
            const mo = String(d.getMonth() + 1).padStart(2, '0');
            return `${yr}-${mo}`;
        }

        // Render Quick Chips & Active Month Display
        function updateMonthUI(monthKey) {
            const activeDisplay = document.getElementById('active-month-display');
            const trendBadge = document.getElementById('trend-month-indicator');
            const donutBadge = document.getElementById('donut-month-indicator');

            const formattedPeriod = formatMonthDisplayName(monthKey);
            if (activeDisplay) activeDisplay.textContent = formattedPeriod;
            if (trendBadge) trendBadge.textContent = formattedPeriod;
            if (donutBadge) donutBadge.textContent = formattedPeriod;

            renderQuickChips(monthKey);
            renderModalGrid();
        }

        function renderQuickChips(monthKey) {
            const container = document.getElementById('quick-month-chips');
            if (!container) return;

            const chipKeys = [];
            chipKeys.push('all');

            const currentYM = getCurrentYearMonth();
            const seen = new Set(['all']);

            availableMonthsCache.forEach(m => {
                if (!seen.has(m.key)) {
                    chipKeys.push(m.key);
                    seen.add(m.key);
                }
            });

            if (!seen.has(currentYM)) {
                chipKeys.splice(1, 0, currentYM);
                seen.add(currentYM);
            }

            if (monthKey && !seen.has(monthKey)) {
                chipKeys.splice(1, 0, monthKey);
                seen.add(monthKey);
            }

            container.innerHTML = '';
            chipKeys.forEach(k => {
                const isSelected = (k === monthKey);
                const chipBtn = document.createElement('button');
                chipBtn.type = 'button';
                chipBtn.className = isSelected
                    ? 'px-3 py-1.5 rounded-xl text-xs font-bold bg-gradient-to-r from-primary to-primary-container text-white shadow-sm shadow-primary/30 border border-primary transition-all active:scale-95 flex-shrink-0 cursor-pointer flex items-center gap-1.5'
                    : 'px-3 py-1.5 rounded-xl text-xs font-semibold bg-surface-container-lowest text-on-surface-variant hover:text-on-surface border border-outline-variant/60 hover:border-primary/40 hover:bg-surface-container transition-all active:scale-95 flex-shrink-0 cursor-pointer flex items-center gap-1.5';

                chipBtn.innerHTML = `
                    ${isSelected ? '<span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>' : ''}
                    <span>${formatMonthDisplayName(k)}</span>
                `;
                chipBtn.addEventListener('click', () => {
                    if (k !== selectedMonth) selectMonth(k);
                });
                container.appendChild(chipBtn);
            });
        }

        // Render Month Grid inside the Modal
        function renderModalGrid() {
            const grid = document.getElementById('modal-months-grid');
            const yearDisplay = document.getElementById('modal-year-display');
            const allMonthsCheck = document.getElementById('all-months-check');
            const allMonthsBtn = document.getElementById('modal-all-months-btn');
            if (!grid) return;

            if (yearDisplay) yearDisplay.textContent = modalYear;

            if (selectedMonth === 'all') {
                allMonthsCheck?.classList.remove('hidden');
                allMonthsBtn?.classList.add('border-primary', 'bg-primary/5', 'ring-1', 'ring-primary/30');
            } else {
                allMonthsCheck?.classList.add('hidden');
                allMonthsBtn?.classList.remove('border-primary', 'bg-primary/5', 'ring-1', 'ring-primary/30');
            }

            grid.innerHTML = '';
            MONTH_NAMES.forEach((mName, idx) => {
                const monthNumStr = String(idx + 1).padStart(2, '0');
                const key = `${modalYear}-${monthNumStr}`;
                const isSelected = (key === selectedMonth);
                const hasData = availableMonthsCache.some(m => m.key === key);

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = isSelected
                    ? 'py-2.5 px-2 rounded-2xl bg-gradient-to-tr from-primary to-primary-container text-white font-extrabold text-xs shadow-sm shadow-primary/30 border border-primary transition-all active:scale-95 cursor-pointer relative flex flex-col items-center justify-center gap-0.5'
                    : 'py-2.5 px-2 rounded-2xl bg-surface-container-low hover:bg-surface-container text-on-surface hover:text-primary font-bold text-xs border border-outline-variant/40 hover:border-primary/40 transition-all active:scale-95 cursor-pointer relative flex flex-col items-center justify-center gap-0.5';

                btn.innerHTML = `
                    <span>${mName}</span>
                    <span class="text-[9px] ${isSelected ? 'text-white/80' : 'text-on-surface-variant/70'} font-normal">${modalYear}</span>
                    ${hasData && !isSelected ? '<span class="w-1.5 h-1.5 rounded-full bg-emerald-600 absolute top-1.5 right-1.5" title="Has recorded trips"></span>' : ''}
                `;

                btn.addEventListener('click', () => {
                    closeMonthModal();
                    selectMonth(key);
                });
                grid.appendChild(btn);
            });
        }

        function selectMonth(newMonth) {
            selectedMonth = newMonth;
            if (newMonth && newMonth !== 'all') {
                modalYear = parseInt(newMonth.split('-')[0], 10) || modalYear;
            }
            updateMonthUI(selectedMonth);
            fetchLiveStats(selectedMonth);
        }

        // Modal Controls
        const monthModal = document.getElementById('month-picker-modal');
        const openModalBtn = document.getElementById('month-picker-trigger');
        const closeModalBtn = document.getElementById('close-month-modal-btn');
        const allMonthsBtn = document.getElementById('modal-all-months-btn');

        function openMonthModal() {
            if (selectedMonth && selectedMonth !== 'all') {
                modalYear = parseInt(selectedMonth.split('-')[0], 10) || new Date().getFullYear();
            }
            renderModalGrid();
            monthModal?.classList.remove('hidden');
            document.body.classList.add('overflow-hidden');
        }

        function closeMonthModal() {
            monthModal?.classList.add('hidden');
            document.body.classList.remove('overflow-hidden');
        }

        openModalBtn?.addEventListener('click', openMonthModal);
        closeModalBtn?.addEventListener('click', closeMonthModal);
        monthModal?.addEventListener('click', (e) => {
            if (e.target === monthModal) closeMonthModal();
        });

        allMonthsBtn?.addEventListener('click', () => {
            closeMonthModal();
            selectMonth('all');
        });

        document.getElementById('modal-prev-year-btn')?.addEventListener('click', () => {
            modalYear--;
            renderModalGrid();
        });

        document.getElementById('modal-next-year-btn')?.addEventListener('click', () => {
            modalYear++;
            renderModalGrid();
        });

        // Previous / Next Buttons in Main View
        document.getElementById('prev-month-btn')?.addEventListener('click', () => {
            selectMonth(getAdjacentMonth(selectedMonth, -1));
        });

        document.getElementById('next-month-btn')?.addEventListener('click', () => {
            selectMonth(getAdjacentMonth(selectedMonth, 1));
        });

        function initCharts(trendData, expenseData, monthlyTrend, currentMonthKey, categoryLabels = {}, categoryBreakdown = []) {
            const barCanvas = document.getElementById('monthlyBarChart');
            const lineCanvas = document.getElementById('lineChart');
            const donutCanvas = document.getElementById('donutChart');
            if (!barCanvas || !lineCanvas || !donutCanvas) return;

            const barCtx = barCanvas.getContext('2d');
            const lineCtx = lineCanvas.getContext('2d');
            const donutCtx = donutCanvas.getContext('2d');

            // 1. Monthly Bar Chart (Last 6 Months Trip Count)
            const monthLabels = monthlyTrend && monthlyTrend.length > 0 
                ? monthlyTrend.map(m => m.month) 
                : ['Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug'];
            const monthCounts = monthlyTrend && monthlyTrend.length > 0 
                ? monthlyTrend.map(m => m.count) 
                : [0, 0, 0, 0, 0, 0];
            const monthKeys = monthlyTrend && monthlyTrend.length > 0
                ? monthlyTrend.map(m => m.monthKey)
                : [];

            const barColors = monthKeys.map(k => (k === currentMonthKey ? '#004ac6' : '#b4c5ff'));

            if (barChartInstance) barChartInstance.destroy();
            barChartInstance = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: monthLabels,
                    datasets: [{
                        label: 'Trips',
                        data: monthCounts,
                        backgroundColor: barColors,
                        borderRadius: 6,
                        barThickness: 22
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    onClick: (e, activeElements) => {
                        if (activeElements && activeElements.length > 0) {
                            const idx = activeElements[0].index;
                            const clickedKey = monthKeys[idx];
                            if (clickedKey && clickedKey !== selectedMonth) {
                                selectMonth(clickedKey);
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { precision: 0, font: { size: 10 } },
                            grid: { color: '#f2f4f6' }
                        },
                        x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                    }
                }
            });

            // 2. Line Chart (Earnings vs Expenses for selected month)
            const labels = trendData && trendData.length > 0 ? trendData.map(t => t.day) : ['No Trips'];
            const earnings = trendData && trendData.length > 0 ? trendData.map(t => t.earnings) : [0];
            const expenses = trendData && trendData.length > 0 ? trendData.map(t => t.expenses) : [0];

            if (lineChartInstance) lineChartInstance.destroy();
            lineChartInstance = new Chart(lineCtx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Earnings',
                            data: earnings,
                            borderColor: '#004ac6',
                            backgroundColor: 'rgba(0, 74, 198, 0.1)',
                            borderWidth: 2,
                            tension: 0.3,
                            fill: true
                        },
                        {
                            label: 'Expenses',
                            data: expenses,
                            borderColor: '#ba1a1a',
                            borderWidth: 2,
                            borderDash: [4, 4],
                            tension: 0.3,
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: true, position: 'top', labels: { boxWidth: 10, font: { size: 10 } } } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function (value) { return '₹' + value.toLocaleString('en-IN'); },
                                font: { size: 10 }
                            },
                            grid: { color: '#f2f4f6' }
                        },
                        x: { 
                            grid: { display: false }, 
                            ticks: { 
                                font: { size: 9 },
                                maxRotation: 45,
                                autoSkip: true,
                                maxTicksLimit: 12
                            } 
                        }
                    }
                }
            });

            // 3. Expense Breakdown Donut Chart
            let donutLabels = [];
            let donutValues = [];
            let donutColors = [];

            if (categoryBreakdown && Array.isArray(categoryBreakdown) && categoryBreakdown.length > 0) {
                const palette = ['#004ac6', '#ba1a1a', '#e06d00', '#10b981', '#7588ff', '#8b5cf6', '#ec4899', '#06b6d4', '#f59e0b'];
                donutLabels = categoryBreakdown.map(c => c.name);
                donutValues = categoryBreakdown.map(c => c.amount);
                donutColors = categoryBreakdown.map((c, i) => palette[i % palette.length]);
            } else {
                const fuel = expenseData ? (expenseData.fuel || 0) : 0;
                const tolls = expenseData ? (expenseData.tolls || 0) : 0;
                const allowance = expenseData ? (expenseData.allowance || 0) : 0;
                const others = expenseData ? (expenseData.others || 0) : 0;

                const fuelLabel = categoryLabels.fuel || 'Fuel';
                const tollsLabel = categoryLabels.tolls || 'Tolls';
                const allowanceLabel = categoryLabels.allowance || 'Allowance';
                const othersLabel = categoryLabels.others || 'Others';

                const hasExpense = (fuel + tolls + allowance + others) > 0;
                donutLabels = hasExpense ? [fuelLabel, tollsLabel, allowanceLabel, othersLabel] : ['No Expenses'];
                donutValues = hasExpense ? [fuel, tolls, allowance, others] : [1];
                donutColors = hasExpense ? ['#004ac6', '#ba1a1a', '#e06d00', '#7588ff'] : ['#e2e8f0'];
            }

            if (donutChartInstance) donutChartInstance.destroy();
            donutChartInstance = new Chart(donutCtx, {
                type: 'doughnut',
                data: {
                    labels: donutLabels,
                    datasets: [{
                        data: donutValues,
                        backgroundColor: donutColors,
                        borderWidth: 0,
                        cutout: '70%'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'right',
                            labels: { boxWidth: 10, font: { size: 10 } }
                        }
                    }
                }
            });
        }

        // Fetch Live Stats & Charts from Neon Database for selected month
        async function fetchLiveStats(month = selectedMonth) {
            try {
                const queryParam = month ? `?month=${encodeURIComponent(month)}` : '';
                const [statsRes, chartRes] = await Promise.all([
                    fetch(`/api/stats${queryParam}`).then(r => r.json()),
                    fetch(`/api/charts${queryParam}`).then(r => r.json())
                ]);

                if (statsRes.success && statsRes.data) {
                    const d = statsRes.data;
                    const tripsEl = document.getElementById('stat-total-trips');
                    const incEl = document.getElementById('stat-total-income');
                    const expEl = document.getElementById('stat-total-expense');
                    const netEl = document.getElementById('stat-net-profit');

                    if (tripsEl) tripsEl.textContent = d.total_trips;
                    if (incEl) incEl.textContent = '₹' + Math.round(d.total_income).toLocaleString('en-IN');
                    if (expEl) expEl.textContent = '₹' + Math.round(d.total_expense).toLocaleString('en-IN');
                    if (netEl) netEl.textContent = '₹' + Math.round(d.net_profit).toLocaleString('en-IN');
                }

                if (chartRes.success && chartRes.data) {
                    if (chartRes.data.availableMonths) {
                        availableMonthsCache = chartRes.data.availableMonths;
                        updateMonthUI(month);
                    }
                    initCharts(
                        chartRes.data.trend || [], 
                        chartRes.data.expenseBreakdown || {}, 
                        chartRes.data.monthlyTrend || [],
                        month,
                        chartRes.data.categoryLabels || {},
                        chartRes.data.categoryBreakdown || []
                    );
                } else {
                    initCharts([], {}, [], month);
                }
            } catch (e) {
                console.warn('Could not fetch stats/charts from database:', e);
                initCharts([], {}, [], month);
            }
        }

        // Initialize with default current month
        updateMonthUI(selectedMonth);
        fetchLiveStats(selectedMonth);

        // Auto-refresh when navigating back from Settings or other pages
        window.addEventListener('pageshow', () => {
            fetchLiveStats(selectedMonth);
        });
    </script>
</body>

</html>
