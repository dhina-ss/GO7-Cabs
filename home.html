<!DOCTYPE html>

<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>GO7 Cabs</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#004ac6">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="go7-logo.png">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed": "#00174b",
                        "secondary": "#505f76",
                        "surface": "#f7f9fb",
                        "surface-container-low": "#f2f4f6",
                        "on-surface-variant": "#434655",
                        "surface-bright": "#f7f9fb",
                        "on-secondary-container": "#54647a",
                        "on-surface": "#191c1e",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2d3133",
                        "secondary-container": "#d0e1fb",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed": "#0b1c30",
                        "surface-variant": "#e0e3e5",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#b4c5ff",
                        "primary-fixed": "#dbe1ff",
                        "error": "#ba1a1a",
                        "outline": "#737686",
                        "tertiary-fixed": "#dae2fd",
                        "on-primary-fixed-variant": "#003ea8",
                        "tertiary-container": "#656d84",
                        "primary-container": "#2563eb",
                        "on-tertiary-fixed-variant": "#3f465c",
                        "on-error-container": "#93000a",
                        "on-tertiary-container": "#eef0ff",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#38485d",
                        "inverse-on-surface": "#eff1f3",
                        "secondary-fixed": "#d3e4fe",
                        "surface-dim": "#d8dadc",
                        "surface-tint": "#0053db",
                        "on-tertiary-fixed": "#131b2e",
                        "tertiary-fixed-dim": "#bec6e0",
                        "on-tertiary": "#ffffff",
                        "primary": "#004ac6",
                        "background": "#f7f9fb",
                        "on-secondary": "#ffffff",
                        "on-primary-container": "#eeefff",
                        "surface-container-high": "#e6e8ea",
                        "on-background": "#191c1e",
                        "surface-container-highest": "#e0e3e5",
                        "tertiary": "#4d556b",
                        "outline-variant": "#c3c6d7",
                        "secondary-fixed-dim": "#b7c8e1",
                        "surface-container": "#eceef0",
                        "inverse-primary": "#b4c5ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-x": "32px",
                        "container-max": "1440px",
                        "gutter": "24px",
                        "stack-md": "16px",
                        "stack-lg": "24px",
                        "card-padding": "24px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "currency-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "currency-md": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* Hide scrollbar for horizontal scrolling chips */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            /* IE and Edge */
            scrollbar-width: none;
            /* Firefox */
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="bg-background text-on-background font-body-md min-h-screen pb-20">
    <!-- Top App Bar (Mobile) -->
    <header
        class="fixed top-0 left-0 w-full z-40 bg-surface/80 backdrop-blur-md dark:bg-background/80 border-b border-outline-variant dark:border-outline flex justify-between items-center h-16 px-4">
        <img src="go7-logo.png" alt="Go 7 Logo" class="h-9 w-auto object-contain" />
    </header>
    <!-- Main Content Canvas -->
    <main class="pt-20 px-4 space-y-stack-lg max-w-md mx-auto pb-6">
        <!-- Bento Analysis Summary Cards (Moved from trip.html) -->
        <section class="grid grid-cols-2 gap-3">
            <div
                class="bg-surface-container-lowest border border-outline-variant/60 rounded-2xl p-4 shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-center text-on-surface-variant mb-1">
                    <span class="text-xs font-semibold">Total Trips</span>
                    <span class="material-symbols-outlined text-primary text-[20px]">local_taxi</span>
                </div>
                <span id="stat-total-trips" class="text-2xl font-bold text-on-surface mt-1">0</span>
            </div>

            <div
                class="bg-surface-container-lowest border border-outline-variant/60 rounded-2xl p-4 shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-center text-on-surface-variant mb-1">
                    <span class="text-xs font-semibold">Net Profit</span>
                    <span class="material-symbols-outlined text-primary text-[20px]">savings</span>
                </div>
                <span id="stat-net-profit" class="text-xl font-bold text-primary mt-1">₹0</span>
            </div>

            <div
                class="bg-surface-container-lowest border border-outline-variant/60 rounded-2xl p-4 shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-center text-on-surface-variant mb-1">
                    <span class="text-xs font-semibold">Total Income</span>
                    <span class="material-symbols-outlined text-emerald-600 text-[20px]">account_balance_wallet</span>
                </div>
                <span id="stat-total-income" class="text-xl font-bold text-emerald-700 mt-1">₹0</span>
            </div>

            <div
                class="bg-surface-container-lowest border border-outline-variant/60 rounded-2xl p-4 shadow-sm flex flex-col justify-between">
                <div class="flex justify-between items-center text-on-surface-variant mb-1">
                    <span class="text-xs font-semibold">Expenses</span>
                    <span class="material-symbols-outlined text-error text-[20px]">credit_card</span>
                </div>
                <span id="stat-total-expense" class="text-xl font-bold text-error mt-1">₹0</span>
            </div>

        </section>
        <!-- Charts Section -->
        <div class="space-y-6">
            <!-- Monthly Trip Count (Last 6 Months) -->
            <div class="bg-surface-container-lowest rounded-xl border border-outline-variant/30 p-4 shadow-sm">
                <h3 class="text-label-md font-label-md text-on-surface mb-4">Monthly Trip Count (Last 6 Months)</h3>
                <div class="h-48 w-full relative">
                    <canvas id="monthlyBarChart"></canvas>
                </div>
            </div>
            <!-- Line Chart: Earnings vs Expenses -->
            <div class="bg-surface-container-lowest rounded-xl p-4 border border-outline-variant/30 shadow-sm">
                <h3 class="text-label-md font-label-md text-on-surface mb-4">Earnings vs Expenses</h3>
                <div class="h-48 w-full relative">
                    <canvas id="lineChart"></canvas>
                </div>
            </div>
            <!-- Donut Chart: Expense Breakdown -->
            <div class="bg-surface-container-lowest rounded-xl p-4 border border-outline-variant/30 shadow-sm">
                <h3 class="text-label-md font-label-md text-on-surface mb-4">Expense Breakdown</h3>
                <div class="h-48 w-full relative flex justify-center">
                    <canvas id="donutChart"></canvas>
                </div>
            </div>
        </div>
    </main>

    <!-- Floating Rounded Bottom Navigation Bar (Mobile) -->
    <nav
        class="fixed bottom-3 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-sm h-16 bg-surface/95 backdrop-blur-md border border-outline-variant/60 rounded-full shadow-lg flex justify-around items-center z-50 transition-all">
        <a class="flex flex-col items-center gap-1 text-primary p-2 transition-transform active:scale-95"
            href="home.html">
            <span class="material-symbols-outlined filled">home</span>
            <span class="text-[10px] font-semibold">Home</span>
        </a>
        <a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-all p-2 active:scale-95"
            href="trip.html">
            <span class="material-symbols-outlined">route</span>
            <span class="text-[10px]">Trip</span>
        </a>
        <a class="flex flex-col items-center gap-1 text-on-surface-variant hover:text-primary transition-all p-2 active:scale-95"
            href="driver.html">
            <span class="material-symbols-outlined">person_pin</span>
            <span class="text-[10px]">Driver</span>
        </a>
    </nav>
    <script>
        let barChartInstance = null;
        let lineChartInstance = null;
        let donutChartInstance = null;

        function initCharts(trendData, expenseData, monthlyTrend) {
            const barCanvas = document.getElementById('monthlyBarChart');
            const lineCanvas = document.getElementById('lineChart');
            const donutCanvas = document.getElementById('donutChart');
            if (!barCanvas || !lineCanvas || !donutCanvas) return;

            const barCtx = barCanvas.getContext('2d');
            const lineCtx = lineCanvas.getContext('2d');
            const donutCtx = donutCanvas.getContext('2d');

            // 1. Monthly Bar Chart (Last 6 Months Trip Count)
            const monthLabels = monthlyTrend && monthlyTrend.length > 0 
                ? monthlyTrend.map(m => m.month) 
                : ['Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug'];
            const monthCounts = monthlyTrend && monthlyTrend.length > 0 
                ? monthlyTrend.map(m => m.count) 
                : [0, 0, 0, 0, 0, 0];

            if (barChartInstance) barChartInstance.destroy();
            barChartInstance = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: monthLabels,
                    datasets: [{
                        label: 'Trips',
                        data: monthCounts,
                        backgroundColor: '#004ac6',
                        borderRadius: 6,
                        barThickness: 22
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { precision: 0, font: { size: 10 } },
                            grid: { color: '#f2f4f6' }
                        },
                        x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                    }
                }
            });

            // 2. Line Chart (Earnings vs Expenses)
            const labels = trendData && trendData.length > 0 ? trendData.map(t => t.day) : ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            const earnings = trendData && trendData.length > 0 ? trendData.map(t => t.earnings) : [0, 0, 0, 0, 0, 0, 0];
            const expenses = trendData && trendData.length > 0 ? trendData.map(t => t.expenses) : [0, 0, 0, 0, 0, 0, 0];

            if (lineChartInstance) lineChartInstance.destroy();
            lineChartInstance = new Chart(lineCtx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Earnings',
                            data: earnings,
                            borderColor: '#004ac6',
                            backgroundColor: 'rgba(0, 74, 198, 0.1)',
                            borderWidth: 2,
                            tension: 0.4,
                            fill: true
                        },
                        {
                            label: 'Expenses',
                            data: expenses,
                            borderColor: '#ba1a1a',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            tension: 0.4,
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: true, position: 'top', labels: { boxWidth: 10, font: { size: 10 } } } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function (value) { return '₹' + value; },
                                font: { size: 10 }
                            },
                            grid: { color: '#f2f4f6' }
                        },
                        x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                    }
                }
            });

            // 3. Expense Breakdown Donut Chart
            const fuel = expenseData ? (expenseData.fuel || 0) : 0;
            const tolls = expenseData ? (expenseData.tolls || 0) : 0;
            const allowance = expenseData ? (expenseData.allowance || 0) : 0;
            const others = expenseData ? (expenseData.others || 0) : 0;

            const hasExpense = (fuel + tolls + allowance + others) > 0;
            const donutLabels = hasExpense ? ['Fuel', 'Tolls', 'Allowance', 'Others'] : ['No Expenses'];
            const donutValues = hasExpense ? [fuel, tolls, allowance, others] : [1];
            const donutColors = hasExpense ? ['#004ac6', '#ba1a1a', '#e06d00', '#7588ff'] : ['#e2e8f0'];

            if (donutChartInstance) donutChartInstance.destroy();
            donutChartInstance = new Chart(donutCtx, {
                type: 'doughnut',
                data: {
                    labels: donutLabels,
                    datasets: [{
                        data: donutValues,
                        backgroundColor: donutColors,
                        borderWidth: 0,
                        cutout: '70%'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'right',
                            labels: { boxWidth: 10, font: { size: 10 } }
                        }
                    }
                }
            });
        }

        // Fetch Live Stats & Charts from Neon Database
        async function fetchLiveStats() {
            try {
                const res = await fetch('/api/stats');
                const json = await res.json();
                if (json.success && json.data) {
                    const d = json.data;
                    const tripsEl = document.getElementById('stat-total-trips');
                    const incEl = document.getElementById('stat-total-income');
                    const expEl = document.getElementById('stat-total-expense');
                    const netEl = document.getElementById('stat-net-profit');

                    if (tripsEl) tripsEl.textContent = d.total_trips;
                    if (incEl) incEl.textContent = '₹' + d.total_income.toLocaleString('en-IN');
                    if (expEl) expEl.textContent = '₹' + d.total_expense.toLocaleString('en-IN');
                    if (netEl) netEl.textContent = '₹' + d.net_profit.toLocaleString('en-IN');
                }

                const chartRes = await fetch('/api/charts');
                const chartJson = await chartRes.json();
                if (chartJson.success && chartJson.data) {
                    initCharts(
                        chartJson.data.trend || [], 
                        chartJson.data.expenseBreakdown || {}, 
                        chartJson.data.monthlyTrend || []
                    );
                } else {
                    initCharts([], {}, []);
                }
            } catch (e) {
                console.warn('Could not fetch stats/charts from database:', e);
                initCharts([], {}, []);
            }
        }
        fetchLiveStats();
    </script>
</body>

</html>
